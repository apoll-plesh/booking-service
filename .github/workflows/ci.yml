name: CI

on:
  push:
    branches: [master, test-fail]
  pull_request:
    branches: [master]

jobs:
  build:
    name: Lint + build artifact
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build artifact
        run: |
          mkdir -p artifact
          cp -r server.js package.json package-lock.json src scripts migrations public docs README.md .env.example artifact/
          tar -czf booking-service-${{ github.sha }}.tar.gz -C artifact .
          ls -lh booking-service-*.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: booking-service-${{ github.sha }}
          path: booking-service-*.tar.gz
          retention-days: 30