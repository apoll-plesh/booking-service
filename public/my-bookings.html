<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Мои брони — Бронь без конфликтов</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header>
    <h1>Бронь без конфликтов</h1>
    <nav>
      <a href="/catalog.html">Каталог</a>
      <a href="/my-bookings.html">Мои брони</a>
      <a href="/admin.html" id="admin-link" style="display:none;">Админ</a>
    </nav>
    <div class="user-info">
      <span id="user-name"></span>
      <button id="logout-btn" class="secondary" type="button">Выйти</button>
    </div>
  </header>

  <main>
    <h2>Мои бронирования</h2>

    <div class="card">
      <div class="form-row">
        <label for="status-filter">Фильтр по статусу</label>
        <select id="status-filter">
          <option value="">Все</option>
          <option value="active">Активные</option>
          <option value="cancelled">Отменённые</option>
        </select>
      </div>
    </div>

    <div id="list-loading" class="loading">Загрузка…</div>
    <div id="list-error" class="error" role="alert"></div>
    <div id="list-empty" class="empty" style="display:none;">У вас пока нет броней.</div>

    <table id="list-table" style="display:none;">
      <thead>
        <tr>
          <th>№</th>
          <th>Время (МСК)</th>
          <th>Цель</th>
          <th>Статус</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="list-body"></tbody>
    </table>

    <div id="cancel-success" class="success" role="status" style="margin-top:12px;"></div>
    <div id="cancel-error" class="error" role="alert" style="margin-top:8px;"></div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/common.js"></script>
  <script src="/js/my-bookings.js"></script>
</body>
</html>
